<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IELTS Speaking · Expression Bank</title>
<meta name="theme-color" content="#3559e0"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#697386;--line:#e6eaf1;--brand:#3559e0;--brand2:#263ea9;--soft:#eef2ff;--green:#15734b;--shadow:0 18px 48px rgba(23,32,51,.08)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f9fbff 0,#f5f7fb 260px);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}.shell{max-width:1200px;margin:0 auto;padding:28px 22px 72px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.brand{display:flex;gap:12px;align-items:center}.logo{width:44px;height:44px;border-radius:13px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:900}.brand b{display:block}.brand span{font-size:12px;color:var(--muted)}.home-link{text-decoration:none;color:#536079;font-size:13px;font-weight:800;background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 11px}.hero{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:29px;margin-bottom:18px}.eyebrow{font-size:12px;color:var(--brand);font-weight:900;letter-spacing:.12em}h1{font-size:38px;margin:8px 0 12px;line-height:1.15}.hero p{max-width:760px;color:var(--muted);line-height:1.75;margin:0}.hero-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}.pill{font-size:11px;font-weight:800;background:#f3f5f9;color:#596579;padding:7px 9px;border-radius:999px}.pill.ready{background:#edf8f2;color:var(--green)}.toolbar{margin:16px 0 10px}.search{position:relative}.search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 15px 13px 42px;outline:none}.search:before{content:"⌕";position:absolute;left:15px;top:8px;font-size:23px;color:#98a2b3}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}.filter{border:1px solid var(--line);background:#fff;color:#475467;padding:9px 11px;border-radius:999px;font-size:12px;font-weight:800}.filter.active{background:var(--soft);border-color:#cad4ff;color:var(--brand2)}.section-head{display:flex;justify-content:space-between;align-items:end;margin:19px 2px 12px}.section-head h2{margin:0;font-size:20px}.section-head span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 24px rgba(23,32,51,.04);min-height:202px;display:flex;flex-direction:column;transition:.16s}.card:hover{transform:translateY(-2px);border-color:#cbd5ff;box-shadow:0 14px 34px rgba(23,32,51,.08)}.card h3{font-size:19px;margin:0 0 7px;line-height:1.3}.zh{font-size:14px;font-weight:750;color:#475467;margin-bottom:10px}.desc{font-size:12.5px;line-height:1.65;color:var(--muted);flex:1}.progress-line{height:5px;background:#eef0f4;border-radius:99px;overflow:hidden;margin:13px 0 0}.progress-line i{display:block;height:100%;background:var(--brand);border-radius:99px}.card-foot{display:flex;justify-content:space-between;gap:8px;align-items:center;border-top:1px solid #f0f2f6;padding-top:12px;margin-top:10px}.card-foot span{font-size:11px;color:#8a94a6}.card-actions{display:flex;gap:7px}.mini{border:0;border-radius:9px;padding:7px 9px;font-size:11px;font-weight:850}.mini.ghost{background:#f2f4f7;color:#475467}.mini.go{background:#edf1ff;color:var(--brand2)}.overlay{position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:50;opacity:0;pointer-events:none;transition:.18s}.overlay.show{opacity:1;pointer-events:auto}.drawer{position:fixed;right:0;top:0;bottom:0;width:min(570px,100%);background:#fff;z-index:60;transform:translateX(100%);transition:.22s ease;box-shadow:-20px 0 60px rgba(15,23,42,.16);overflow:auto}.drawer.show{transform:none}.drawer-inner{padding:26px}.close{border:0;background:#f2f4f7;width:34px;height:34px;border-radius:999px;float:right}.detail-kicker{font-size:12px;color:var(--brand);font-weight:900;letter-spacing:.08em;margin-top:10px}.detail-title{font-size:34px;margin:8px 0 5px;line-height:1.15}.detail-zh{font-size:16px;color:#475467;font-weight:800;margin-bottom:18px}.block{border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}.block.soft{background:#f8faff;border-color:#dfe5ff}.block h4{margin:0 0 8px;font-size:13px}.block p{margin:0;color:#586174;line-height:1.7;font-size:14px}.examples{display:grid;gap:9px}.example{background:#f7f8fb;border-radius:12px;padding:11px 12px;font-size:14px;line-height:1.6}.example b{color:var(--brand2)}.detail-progress{font-size:12px;color:#667085}.practice-btn{width:100%;border:0;background:var(--brand);color:white;border-radius:14px;padding:14px 16px;font-weight:900;font-size:15px;margin-top:14px}.reset-btn{width:100%;border:1px solid #e2e6ee;background:#fff;color:#667085;padding:11px 12px;font-size:12px;font-weight:800;border-radius:12px;margin-top:8px}.reset-btn:hover{background:#f7f8fb}.practice-tools{display:flex;gap:8px;align-items:center}.practice-reset{border:1px solid #e2e6ee;background:#fff;color:#667085;border-radius:10px;padding:8px 10px;font-size:11px;font-weight:800}.practice{position:fixed;inset:0;background:linear-gradient(180deg,#f9fbff,#f4f6fb);z-index:100;display:none;overflow:auto}.practice.show{display:block}.practice-wrap{max-width:900px;margin:0 auto;padding:28px 18px 70px}.practice-top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:18px}.back{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px;font-weight:800;color:#475467}.practice-progress{font-size:12px;color:#7b8495}.target{background:#172033;color:#fff;border-radius:21px;padding:22px 24px;margin-bottom:14px}.target small{display:block;color:#aab4c5;font-size:11px;font-weight:800;margin-bottom:6px}.target strong{font-size:27px;line-height:1.25}.target span{display:block;color:#d6dbe5;margin-top:6px;font-size:13px}.scenario-card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--shadow)}.scenario-meta{display:flex;justify-content:space-between;gap:10px;align-items:center}.scenario-type{font-size:11px;font-weight:900;background:#eef2ff;color:var(--brand2);padding:7px 9px;border-radius:999px}.scenario-num{font-size:11px;color:#98a2b3}.cue{height:150px;border-radius:20px;background:radial-gradient(circle at 20% 10%,#eef2ff,transparent 40%),linear-gradient(135deg,#f7f9ff,#eef1f7);display:grid;place-items:center;font-size:64px;margin:18px 0}.prompt-label{font-size:11px;color:#8a94a6;font-weight:850}.prompt{font-size:24px;line-height:1.5;font-weight:800;margin:6px 0 10px}.instruction{color:#667085;font-size:13px;line-height:1.65}.answer{display:none;background:#f7f9ff;border:1px solid #dfe5ff;border-radius:15px;padding:14px 15px;line-height:1.7;margin-top:16px;font-size:14px}.answer.show{display:block}.answer b{color:var(--brand2)}.actions{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:9px;margin-top:16px}.action{border:0;border-radius:12px;padding:12px;font-weight:850}.action.ghost{background:#f1f3f7;color:#475467}.action.light{background:#edf1ff;color:var(--brand2)}.action.primary{background:var(--brand);color:#fff}.complete-note{display:none;margin-top:14px;background:#edf8f2;color:#15734b;border-radius:13px;padding:12px 14px;font-size:13px;font-weight:800}.complete-note.show{display:block}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.shell{padding:18px 12px 54px}h1{font-size:30px}.hero{padding:21px}.grid{grid-template-columns:1fr}.drawer-inner{padding:20px}.detail-title{font-size:29px}.scenario-card{padding:19px}.prompt{font-size:20px}.actions{grid-template-columns:1fr}.target strong{font-size:23px}}
</style></head><body>
<script src="./cloud.js"></script><script src="./speaking-data.js"></script>
<div class="shell"><div class="topbar"><div class="brand"><div class="logo">IELTS</div><div><b>Speaking Lab</b><span>Expression Bank</span></div></div><a class="home-link" href="index.html">← 返回首页</a></div>
<section class="hero"><div class="eyebrow">SPEAKING EXPRESSION BANK</div><h1>学会一个表达，<br>然后在不同场景里真正用出来</h1><p>先理解表达的语感和用法，再进入随机场景反复开口。每次场景都会变化，但核心表达保持不变。</p><div class="hero-meta"><span class="pill">50 个表达</span><span class="pill ready">全部开放场景训练</span><span class="pill">每个 30 个场景 · 共 1500 个</span></div></section>
<div class="toolbar"><div class="search"><input id="search" placeholder="搜索英文、中文意思或使用场景"></div></div><div class="filters" id="filters"></div><div class="section-head"><h2>Expression Bank</h2><span id="shownText"></span></div><main class="grid" id="grid"></main></div>
<div id="overlay" class="overlay"></div><aside id="drawer" class="drawer"><div class="drawer-inner"><button class="close" id="close">×</button><div id="detail"></div></div></aside>
<section id="practice" class="practice"><div class="practice-wrap"><div class="practice-top"><button class="back" id="backPractice">← 返回表达</button><div class="practice-tools"><div class="practice-progress" id="practiceProgress"></div><button class="practice-reset" id="resetCurrentProgress">↺ 重置本表达</button></div></div><div class="target"><small>本轮目标表达</small><strong id="targetExpression"></strong><span id="targetMeaning"></span></div><div class="scenario-card"><div class="scenario-meta"><span class="scenario-type" id="scenarioType"></span><span class="scenario-num" id="scenarioNum"></span></div><div class="cue" id="scenarioCue"></div><div class="prompt-label">SCENARIO</div><div class="prompt" id="scenarioPrompt"></div><div class="instruction">先直接开口回答。尽量自然使用本轮目标表达，不需要逐字照搬任何范句。</div><div class="answer" id="scenarioAnswer"></div><div class="complete-note" id="completeNote">✓ 这个表达的 30 个不同场景都已经完成。之后仍然可以继续随机复练。</div><div class="actions"><button class="action ghost" id="shuffleScenario">换一个场景</button><button class="action light" id="showAnswer">参考表达</button><button class="action primary" id="doneScenario">我说完了 · 下一个</button></div></div></div></section>
<script>
(function(){
const expressions=window.SPEAKING_EXPRESSIONS, scenarioSets=window.SPEAKING_SCENARIOS; const categories=['全部',...new Set(expressions.map(x=>x.c))]; let active='全部',currentExpression=null,currentScenario=null,order=[],pos=0;
const $=id=>document.getElementById(id);
function uid(){try{return window.IELTSCloud&&window.IELTSCloud.uid&&window.IELTSCloud.uid()||'guest'}catch(e){return'guest'}}
function pkey(i){return `speakingScenarioProgressV1:${uid()}:${i}`}
function readProgress(i){try{const x=JSON.parse(localStorage.getItem(pkey(i))||'{}');return {seen:Array.isArray(x.seen)?[...new Set(x.seen.map(Number).filter(n=>n>=0&&n<30))]:[],reps:Number(x.reps)||0}}catch(e){return{seen:[],reps:0}}}
function writeProgress(i,p){localStorage.setItem(pkey(i),JSON.stringify(p))}
function renderFilters(){ $('filters').innerHTML=categories.map(c=>`<button class="filter ${c===active?'active':''}" data-c="${c}">${c}</button>`).join(''); $('filters').querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.c;renderFilters();render()}) }
function render(){const q=$('search').value.trim().toLowerCase();const rows=expressions.filter(x=>(active==='全部'||x.c===active)&&(!q||[x.e,x.z,x.d,x.c].join(' ').toLowerCase().includes(q)));$('shownText').textContent=`显示 ${rows.length} / 50 条`;$('grid').innerHTML=rows.map(x=>{const i=expressions.indexOf(x),p=readProgress(i),pct=Math.round(p.seen.length/30*100);return `<article class="card"><h3>${x.e}</h3><div class="zh">${x.z}</div><div class="desc">${x.d}</div><div class="progress-line"><i style="width:${pct}%"></i></div><div class="card-foot"><span>${x.c} · ${p.seen.length}/30</span><div class="card-actions"><button class="mini ghost detail-btn" data-i="${i}">详情</button><button class="mini go train-btn" data-i="${i}">开始训练</button></div></div></article>`}).join('');$('grid').querySelectorAll('.detail-btn').forEach(b=>b.onclick=()=>openDetail(+b.dataset.i));$('grid').querySelectorAll('.train-btn').forEach(b=>b.onclick=()=>startPractice(+b.dataset.i))}
function openDetail(i){const x=expressions[i],p=readProgress(i);currentExpression=i;$('detail').innerHTML=`<div class="detail-kicker">${x.c}</div><div class="detail-title">${x.e}</div><div class="detail-zh">${x.z}</div><div class="block soft"><h4>核心意思</h4><p>${x.usage}</p></div><div class="block"><h4>怎么理解</h4><p>${x.d}</p></div><div class="block"><h4>自然例句</h4><div class="examples">${x.examples.map(e=>`<div class="example">${e}</div>`).join('')}</div></div><div class="block"><h4>使用提醒</h4><p>${x.note}</p></div><div class="block"><h4>场景进度</h4><p class="detail-progress">已完成 ${p.seen.length}/30 个不同场景 · 累计开口 ${p.reps} 次</p></div><button class="practice-btn" id="detailPractice">开始场景训练 · 30 个场景</button><button class="reset-btn" id="resetProgress">↺ 重置该表达全部训练进度</button>`;$('overlay').classList.add('show');$('drawer').classList.add('show');$('detailPractice').onclick=()=>{closeDetail();startPractice(i)};$('resetProgress').onclick=()=>{if(confirm('确定重置这个表达的场景练习进度吗？')){localStorage.removeItem(pkey(i));openDetail(i);render()}}}
function closeDetail(){$('overlay').classList.remove('show');$('drawer').classList.remove('show')}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildOrder(i){const p=readProgress(i),unseen=[...Array(30).keys()].filter(n=>!p.seen.includes(n));return unseen.length?shuffle(unseen):shuffle([...Array(30).keys()])}
function startPractice(i){currentExpression=i;order=buildOrder(i);pos=0;$('practice').classList.add('show');$('targetExpression').textContent=expressions[i].e;$('targetMeaning').textContent=expressions[i].z;showScenario()}
function showScenario(){if(pos>=order.length){order=buildOrder(currentExpression);pos=0}currentScenario=order[pos];const s=scenarioSets[currentExpression][currentScenario],p=readProgress(currentExpression);$('scenarioCue').textContent=s.cue;$('scenarioType').textContent=s.type;$('scenarioPrompt').textContent=s.prompt;$('scenarioAnswer').innerHTML=`<b>参考表达：</b> ${s.ref}`;$('scenarioAnswer').classList.remove('show');$('showAnswer').textContent='参考表达';$('scenarioNum').textContent=`场景 ${currentScenario+1} / 30`;$('practiceProgress').textContent=`已完成 ${p.seen.length}/30 个不同场景 · 累计开口 ${p.reps} 次`;$('completeNote').classList.toggle('show',p.seen.length===30)}
function next(countDone){if(countDone){const p=readProgress(currentExpression);if(!p.seen.includes(currentScenario))p.seen.push(currentScenario);p.reps++;writeProgress(currentExpression,p)}pos++;if(pos>=order.length)order=buildOrder(currentExpression),pos=0;showScenario()}
$('resetCurrentProgress').onclick=()=>{if(currentExpression===null)return;if(confirm('确定重置这个表达的全部场景进度吗？这会清除已完成场景和累计开口次数。')){localStorage.removeItem(pkey(currentExpression));order=buildOrder(currentExpression);pos=0;showScenario();render();}};$('shuffleScenario').onclick=()=>next(false);$('doneScenario').onclick=()=>next(true);$('showAnswer').onclick=()=>{$('scenarioAnswer').classList.toggle('show');$('showAnswer').textContent=$('scenarioAnswer').classList.contains('show')?'收起参考':'参考表达'};$('backPractice').onclick=()=>{$('practice').classList.remove('show');openDetail(currentExpression);render()};$('close').onclick=closeDetail;$('overlay').onclick=closeDetail;$('search').oninput=render;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('practice').classList.contains('show'))closeDetail()});
Promise.resolve(window.IELTSCloud&&window.IELTSCloud.ready).catch(()=>{}).finally(()=>{renderFilters();render()});
})();
</script><script src="./pwa-update.js"></script></body></html>
