<style>
:root{--bg:#f6f8fc;--card:#fff;--ink:#172033;--muted:#667085;--line:#e3e8f2;--brand:#3559e0;--brand2:#273fb6;--green:#16794a;--greenbg:#eaf8f1;--shadow:0 12px 36px rgba(23,36,71,.07)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(180deg,#f8faff 0,#f6f8fc 220px);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif}.wrap{max-width:1180px;margin:0 auto;padding:26px 20px 70px}.topnav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.navlinks{display:flex;gap:9px;flex-wrap:wrap}.navbtn,.btn{border:1px solid var(--line);background:#fff;color:#344054;border-radius:11px;padding:10px 14px;font-size:13px;font-weight:800;text-decoration:none;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.navbtn.primary,.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.hero{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin-bottom:20px}.eyebrow{font-size:12px;font-weight:850;letter-spacing:.13em;color:var(--brand);text-transform:uppercase}.hero h1{font-size:34px;margin:7px 0 8px}.hero p{color:var(--muted);margin:0;line-height:1.7}.progressCard{min-width:250px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px 16px;box-shadow:var(--shadow)}.progressMeta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px}.track{height:8px;border-radius:999px;background:#eef1f6;overflow:hidden}.bar{height:100%;background:var(--green);width:0;transition:.2s}.layout{display:grid;grid-template-columns:270px 1fr;gap:18px}.side,.main{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.side{padding:17px;position:sticky;top:16px;height:fit-content;max-height:calc(100vh - 32px);overflow:auto}.sideTitle{font-size:13px;color:#475467;font-weight:850;margin:1px 0 10px}.topicbtn{width:100%;border:1px solid transparent;background:transparent;text-align:left;border-radius:10px;padding:10px 11px;cursor:pointer;color:#344054;margin:1px 0;display:flex;align-items:center;gap:9px}.topicbtn:hover{background:#f7f8fc}.topicbtn.active{background:#eef2ff;color:var(--brand2);font-weight:850;border-color:#dce4ff}.topicno{font-size:11px;color:#98a2b3;width:22px}.topicbtn.active .topicno{color:var(--brand)}.topictext{flex:1;min-width:0}.topiczh{font-size:13px}.topicen{font-size:10px;color:#98a2b3;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.topicbtn.active .topicen{color:#6e81cc}.main{padding:20px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:17px}.titleblock h2{margin:0 0 4px;font-size:21px}.titleblock p{margin:0;color:var(--muted);font-size:13px}.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.search{border:1px solid #d9dfeb;border-radius:10px;padding:10px 12px;font-size:13px;width:210px;outline:none}.search:focus{border-color:#8fa2ff;box-shadow:0 0 0 3px rgba(53,89,224,.08)}.controlrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:15px 0}.seg{display:inline-flex;border:1px solid var(--line);background:#f7f8fb;border-radius:11px;padding:3px;gap:2px}.seg button{border:0;background:transparent;color:#667085;border-radius:8px;padding:8px 11px;font-size:12px;font-weight:800;cursor:pointer}.seg button.active{background:#fff;color:var(--brand);box-shadow:0 1px 4px rgba(23,36,71,.1)}.checks{display:flex;gap:13px;align-items:center;flex-wrap:wrap;font-size:12px;color:#475467}.checks label{display:flex;gap:6px;align-items:center}.checks input{accent-color:var(--brand)}.countline{font-size:12px;color:#98a2b3;margin:0 0 10px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:11px}.phrase{border:1px solid var(--line);border-radius:14px;padding:14px 15px;min-height:116px;position:relative;background:#fff;transition:.12s}.phrase:hover{border-color:#cad5ff;transform:translateY(-1px)}.phrase.mastered{background:#fbfffd;border-color:#cfe9db}.rowtop{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}.num{font-size:11px;font-weight:850;color:#98a2b3;background:#f2f4f7;border-radius:999px;padding:4px 7px}.masterBtn{border:0;background:transparent;color:#98a2b3;font-size:11px;font-weight:800;cursor:pointer;padding:4px 0}.mastered .masterBtn{color:var(--green)}.en{font-size:16px;font-weight:850;line-height:1.5;color:#1d2939}.zh{margin-top:6px;font-size:14px;line-height:1.55;color:#667085}.hiddenSide{display:none}.empty{grid-column:1/-1;text-align:center;color:#98a2b3;padding:58px 10px}.flashWrap{display:none}.flashWrap.active{display:block}.cards.flashHidden{display:none}.flashCard{max-width:680px;margin:16px auto 8px;border:1px solid var(--line);border-radius:20px;min-height:310px;padding:26px;display:flex;flex-direction:column;justify-content:center;text-align:center;position:relative;background:linear-gradient(180deg,#fff,#fafbff)}.flashTopic{position:absolute;top:17px;left:18px;font-size:11px;color:#667085;background:#f2f4f7;padding:5px 8px;border-radius:999px}.flashNum{position:absolute;top:17px;right:18px;font-size:11px;color:#98a2b3}.flashPrompt{font-size:13px;color:#98a2b3;margin-bottom:12px}.flashMain{font-size:29px;font-weight:900;line-height:1.4}.flashAnswer{margin-top:18px;padding-top:18px;border-top:1px solid var(--line);font-size:18px;line-height:1.55;color:#475467}.flashAnswer.covered{filter:blur(9px);user-select:none;cursor:pointer}.flashActions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:15px}.wordnote{font-size:11px;color:#98a2b3;margin-top:8px;text-align:right}.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#101828;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:20}.hidden{display:none!important}
@media(max-width:920px){.layout{grid-template-columns:1fr}.side{position:static;max-height:none}.moduleList{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.topicbtn{margin:0}.hero{align-items:flex-start;flex-direction:column}.progressCard{width:100%}.cards{grid-template-columns:1fr 1fr}}
@media(max-width:650px){.wrap{padding:18px 12px 50px}.hero h1{font-size:28px}.moduleList{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}.toolbar{flex-direction:column}.tools{justify-content:flex-start}.search{width:100%}.flashMain{font-size:24px}}
</style>

<body><main class="wrap">
<nav class="topnav"><div class="navlinks"><a class="navbtn" href="index.html">← 首页</a><a class="navbtn" href="test.html">去测试</a></div><button class="navbtn primary" id="downloadWord">下载 Word 版</button></nav>
<header class="hero"><div><div class="eyebrow">STUDY CENTER · CLOUD SYNC</div><h1>雅思大作文短语学习中心</h1><p>按照原短语库分类学习。选择话题后，可切换显示方式、随机顺序、标记掌握状态，也可以用闪卡集中记忆。登录后会自动同步到其他设备。</p></div><div class="progressCard"><div class="progressMeta"><span>总掌握进度</span><b id="overallText">0 / 600</b></div><div class="track"><div class="bar" id="overallBar"></div></div></div></header>
<section class="layout">
<aside class="side"><div class="sideTitle">话题分类</div><div class="moduleList" id="moduleList"></div></aside>
<section class="main">
<div class="toolbar"><div class="titleblock"><h2 id="sectionTitle">全部模块</h2><p id="sectionSub">20 个话题 · 600 条短语</p></div><div class="tools"><input id="search" class="search" type="search" spellcheck="false" autocomplete="off" placeholder="搜索中文或英文"><button class="btn" id="resetModule" disabled>重置本模块</button><button class="btn" id="resetProgress">重置全部</button></div></div>
<div class="controlrow"><div class="seg" id="viewSeg"><button data-view="both" class="active">中英对照</button><button data-view="zh">只看中文</button><button data-view="en">只看英文</button><button data-view="flash">闪卡记忆</button></div><div class="checks"><label><input type="checkbox" id="shuffle">随机顺序</label><label><input type="checkbox" id="unmastered">只看未掌握</label></div></div>
<div class="countline" id="countline"></div><div class="cards" id="cards"></div>
<div class="flashWrap" id="flashWrap"><div class="flashCard"><div class="flashTopic" id="flashTopic"></div><div class="flashNum" id="flashNum"></div><div class="flashPrompt" id="flashPrompt">先回忆答案，再点击下方查看</div><div class="flashMain" id="flashMain"></div><div class="flashAnswer covered" id="flashAnswer" title="点击显示答案"></div></div><div class="flashActions"><button class="btn" id="prevFlash">← 上一条</button><button class="btn primary" id="revealFlash">显示答案</button><button class="btn" id="masterFlash">标记已掌握</button><button class="btn" id="nextFlash">下一条 →</button></div></div>
<div class="wordnote">“下载 Word 版”会在点击时即时生成 .docx 文件，压缩包里不会预先放 Word 文档。</div>
</section></section></main><div id="toast" class="toast hidden"></div>
<script src="./data.js"></script>
<script>
(()=>{
const bank=window.PHRASE_BANK||[], $=id=>document.getElementById(id), esc=s=>(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
const S={topic:'all',view:'both',flashIndex:0,flashPool:[]};
const masteredKey=()=>window.IELTSCloud?window.IELTSCloud.masteredStorageKey():'ieltsPhraseMasteredV1';
const mastered=()=>{try{return new Set(JSON.parse(localStorage.getItem(masteredKey())||'[]'))}catch(e){return new Set()}};
const saveMastered=set=>{try{localStorage.setItem(masteredKey(),JSON.stringify([...set]))}catch(e){}};
const key=(topic,item)=>`${topic.id}:${item.id}`;
let M=mastered();
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.add('hidden'),1600)}
function modulePool(){return S.topic==='all'?bank:bank.filter(m=>m.id===S.topic)}
function currentItems(){let arr=modulePool().flatMap(topic=>topic.items.map(item=>({topic,item})));const q=$('search').value.trim().toLowerCase();if(q)arr=arr.filter(x=>x.item.en.toLowerCase().includes(q)||x.item.zh.toLowerCase().includes(q));if($('unmastered').checked)arr=arr.filter(x=>!M.has(key(x.topic,x.item)));if($('shuffle').checked){arr=[...arr];for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}}return arr}
function renderModules(){const el=$('moduleList');el.innerHTML='';const all=document.createElement('button');all.className='topicbtn active';all.dataset.id='all';all.innerHTML='<span class="topicno">ALL</span><span class="topictext"><div class="topiczh">全部模块</div><div class="topicen">All topics · 600</div></span>';el.appendChild(all);bank.forEach((m,i)=>{const b=document.createElement('button');b.className='topicbtn';b.dataset.id=m.id;b.innerHTML=`<span class="topicno">${String(i+1).padStart(2,'0')}</span><span class="topictext"><div class="topiczh">${esc(m.nameZh)}</div><div class="topicen">${esc(m.nameEn)}</div></span>`;el.appendChild(b)});el.addEventListener('click',e=>{const b=e.target.closest('.topicbtn');if(!b)return;S.topic=b.dataset.id;S.flashIndex=0;document.querySelectorAll('.topicbtn').forEach(x=>x.classList.toggle('active',x===b));render()})}
function renderProgress(){const total=600,n=M.size;$('overallText').textContent=`${n} / ${total}`;$('overallBar').style.width=`${n/total*100}%`}
function renderHeader(){if(S.topic==='all'){$('sectionTitle').textContent='全部模块';$('sectionSub').textContent='20 个话题 · 600 条短语';$('resetModule').disabled=true;$('resetModule').textContent='重置本模块'}else{const m=bank.find(x=>x.id===S.topic);const got=m.items.filter(it=>M.has(key(m,it))).length;$('sectionTitle').textContent=`${m.nameZh} · ${m.nameEn}`;$('sectionSub').textContent=`第 ${bank.indexOf(m)+1} 模块 · ${m.items.length} 条 · 已掌握 ${got} 条`;$('resetModule').disabled=got===0;$('resetModule').textContent=`重置「${m.nameZh}」(${got})`}}
function toggleMaster(topic,item){const k=key(topic,item),next=!M.has(k);next?M.add(k):M.delete(k);saveMastered(M);render();if(window.IELTSCloud&&window.IELTSCloud.isSignedIn())window.IELTSCloud.setMastered(k,topic.id,item.id,next).catch(()=>{})}
function renderCards(arr){const el=$('cards');el.innerHTML='';if(!arr.length){el.innerHTML='<div class="empty">没有符合当前筛选条件的短语。</div>';return}arr.forEach(({topic,item})=>{const d=document.createElement('article'),k=key(topic,item),done=M.has(k);d.className='phrase'+(done?' mastered':'');const hideEn=S.view==='zh',hideZh=S.view==='en';d.innerHTML=`<div class="rowtop"><span class="num">${topic.nameZh} · ${item.id}</span><button class="masterBtn">${done?'↺ 取消掌握':'○ 标记掌握'}</button></div><div class="en ${hideEn?'hiddenSide':''}">${esc(item.en)}</div><div class="zh ${hideZh?'hiddenSide':''}">${esc(item.zh)}</div>`;d.querySelector('.masterBtn').onclick=()=>toggleMaster(topic,item);el.appendChild(d)})}
function renderFlash(arr){S.flashPool=arr;if(S.flashIndex>=arr.length)S.flashIndex=Math.max(0,arr.length-1);if(!arr.length){$('flashTopic').textContent='';$('flashNum').textContent='';$('flashMain').textContent='没有符合当前筛选条件的短语';$('flashAnswer').textContent='';$('masterFlash').disabled=true;return}$('masterFlash').disabled=false;const {topic,item}=arr[S.flashIndex];$('flashTopic').textContent=`${topic.nameZh} · ${topic.nameEn}`;$('flashNum').textContent=`${S.flashIndex+1} / ${arr.length}`;$('flashMain').textContent=item.zh;$('flashAnswer').textContent=item.en;$('flashAnswer').classList.add('covered');$('revealFlash').textContent='显示答案';$('masterFlash').textContent=M.has(key(topic,item))?'↺ 取消掌握':'标记已掌握'}
function render(){renderProgress();renderHeader();const arr=currentItems();$('countline').textContent=`当前显示 ${arr.length} 条${$('search').value.trim()?' · 已启用搜索':''}${$('unmastered').checked?' · 仅未掌握':''}`;const flash=S.view==='flash';$('cards').classList.toggle('flashHidden',flash);$('flashWrap').classList.toggle('active',flash);if(flash)renderFlash(arr);else renderCards(arr)}
$('viewSeg').onclick=e=>{const b=e.target.closest('button[data-view]');if(!b)return;S.view=b.dataset.view;S.flashIndex=0;document.querySelectorAll('#viewSeg button').forEach(x=>x.classList.toggle('active',x===b));render()};
$('search').addEventListener('input',()=>{S.flashIndex=0;render()});$('shuffle').onchange=()=>{S.flashIndex=0;render()};$('unmastered').onchange=()=>{S.flashIndex=0;render()};
$('resetModule').onclick=()=>{if(S.topic==='all')return;const m=bank.find(x=>x.id===S.topic);if(!m)return;const keys=m.items.map(it=>key(m,it)).filter(k=>M.has(k));if(!keys.length){toast('本模块还没有已掌握记录');return}if(confirm(`确定要重置「${m.nameZh}」模块的 ${keys.length} 条已掌握记录吗？`)){keys.forEach(k=>M.delete(k));saveMastered(M);render();if(window.IELTSCloud&&window.IELTSCloud.isSignedIn())window.IELTSCloud.clearMastered(m.id).catch(()=>{});toast(`已重置「${m.nameZh}」模块`)}};
$('resetProgress').onclick=()=>{if(confirm(window.IELTSCloud&&window.IELTSCloud.isSignedIn()?'确定要清空这个账号的全部“已掌握”记录吗？此操作会同步到其他设备。':'确定要清空这台设备上的全部“已掌握”记录吗？')){M=new Set();saveMastered(M);render();if(window.IELTSCloud&&window.IELTSCloud.isSignedIn())window.IELTSCloud.clearMastered().catch(()=>{});toast('全部掌握记录已清空')}};
$('revealFlash').onclick=()=>{const a=$('flashAnswer');a.classList.toggle('covered');$('revealFlash').textContent=a.classList.contains('covered')?'显示答案':'隐藏答案'};$('flashAnswer').onclick=()=>$('revealFlash').click();
$('prevFlash').onclick=()=>{if(!S.flashPool.length)return;S.flashIndex=(S.flashIndex-1+S.flashPool.length)%S.flashPool.length;renderFlash(S.flashPool)};$('nextFlash').onclick=()=>{if(!S.flashPool.length)return;S.flashIndex=(S.flashIndex+1)%S.flashPool.length;renderFlash(S.flashPool)};$('masterFlash').onclick=()=>{if(!S.flashPool.length)return;const x=S.flashPool[S.flashIndex],k=key(x.topic,x.item),next=!M.has(k);next?M.add(k):M.delete(k);saveMastered(M);if(window.IELTSCloud&&window.IELTSCloud.isSignedIn())window.IELTSCloud.setMastered(k,x.topic.id,x.item.id,next).catch(()=>{});renderProgress();renderHeader();$('masterFlash').textContent=M.has(k)?'↺ 取消掌握':'标记已掌握';if($('unmastered').checked){const nextPool=currentItems();S.flashPool=nextPool;if(S.flashIndex>=nextPool.length)S.flashIndex=Math.max(0,nextPool.length-1);renderFlash(nextPool)}};
// -------- Pure browser DOCX generation: true .docx, generated only when clicked --------
function crc32(bytes){let c=0xffffffff;for(const b of bytes){c^=b;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0)}return(c^0xffffffff)>>>0}
function u16(n){return new Uint8Array([n&255,(n>>>8)&255])}function u32(n){return new Uint8Array([n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255])}function cat(parts){let n=parts.reduce((s,p)=>s+p.length,0),o=new Uint8Array(n),x=0;for(const p of parts){o.set(p,x);x+=p.length}return o}
function zipStore(files){const te=new TextEncoder(),locals=[],centrals=[];let offset=0;for(const f of files){const name=te.encode(f.name),data=typeof f.data==='string'?te.encode(f.data):f.data,crc=crc32(data),flags=0x0800;const local=cat([u32(0x04034b50),u16(20),u16(flags),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),name,data]);locals.push(local);const cen=cat([u32(0x02014b50),u16(20),u16(20),u16(flags),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset),name]);centrals.push(cen);offset+=local.length}const central=cat(centrals),body=cat(locals),end=cat([u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(central.length),u32(body.length),u16(0)]);return new Blob([body,central,end],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'})}
function xml(s){return String(s).replace(/[<>&\"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','\"':'&quot;',"'":'&apos;'}[c]))}
function wp(text,bold=false,size=22){return `<w:p><w:r><w:rPr>${bold?'<w:b/>':''}<w:sz w:val="${size}"/><w:szCs w:val="${size}"/></w:rPr><w:t xml:space="preserve">${xml(text)}</w:t></w:r></w:p>`}
function cell(text,bold=false){return `<w:tc><w:tcPr><w:tcW w:w="4500" w:type="dxa"/><w:tcMar><w:top w:w="80" w:type="dxa"/><w:left w:w="90" w:type="dxa"/><w:bottom w:w="80" w:type="dxa"/><w:right w:w="90" w:type="dxa"/></w:tcMar></w:tcPr>${wp(text,bold,20)}</w:tc>`}
function makeDocx(){let body=wp('雅思大作文核心话题短语库',true,34)+wp('20 个核心话题 · 600 条短语 / 搭配',false,20);bank.forEach((m,idx)=>{body+=wp(`${idx+1}. ${m.nameZh} (${m.nameEn})`,true,28);let rows=`<w:tr>${cell('序号',true)}${cell('英文短语 / 搭配',true)}${cell('中文翻译',true)}</w:tr>`;m.items.forEach(it=>rows+=`<w:tr>${cell(String(it.id))}${cell(it.en)}${cell(it.zh)}</w:tr>`);body+=`<w:tbl><w:tblPr><w:tblW w:w="0" w:type="auto"/><w:tblBorders><w:top w:val="single" w:sz="6" w:color="B7C0CE"/><w:left w:val="single" w:sz="6" w:color="B7C0CE"/><w:bottom w:val="single" w:sz="6" w:color="B7C0CE"/><w:right w:val="single" w:sz="6" w:color="B7C0CE"/><w:insideH w:val="single" w:sz="4" w:color="D8DEE8"/><w:insideV w:val="single" w:sz="4" w:color="D8DEE8"/></w:tblBorders></w:tblPr><w:tblGrid><w:gridCol w:w="900"/><w:gridCol w:w="4300"/><w:gridCol w:w="4300"/></w:tblGrid>${rows}</w:tbl>${wp('',false,8)}`});body+=`<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1000" w:right="900" w:bottom="1000" w:left="900" w:header="500" w:footer="500" w:gutter="0"/></w:sectPr>`;const doc=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}</w:body></w:document>`;const ct=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`;const rel=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;return zipStore([{name:'[Content_Types].xml',data:ct},{name:'_rels/.rels',data:rel},{name:'word/document.xml',data:doc}])}
$('downloadWord').onclick=()=>{try{const blob=makeDocx(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='雅思大作文核心话题短语库.docx';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1200);toast('Word 文档已生成')}catch(e){console.error(e);alert('生成 Word 文件失败，请换用 Chrome / Edge / Safari 再试。')}};
window.addEventListener('ielts-auth-change',()=>{M=mastered();render()});window.addEventListener('ielts-cloud-sync',()=>{M=mastered();render()});
renderModules();render();
})();
